spring.application.name=BookMatch

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bookmatch
spring.datasource.username=postgres
spring.datasource.password=postman123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google Books
google.books.api-key=${GOOGLE_BOOKS_API_KEY}

# Gemini
gemini.api-key=${GOOGLE_API_KEY}
gemini.model=gemini-2.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# TMDB
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.token=${TMDB_TOKEN}